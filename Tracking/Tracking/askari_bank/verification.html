<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Askari Bank Header</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 40px;
            font-size: 14px;
            background: white;
            border-bottom: 1px solid #ddd;
            margin-left: 350px;
        }

        .top-bar a {
            color: rgb(59, 59, 61);
            font-weight: bold;
            text-decoration: none;
        }

        .header {
            background: white;
            padding: 10px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #ddd;
        }

        .logo img {
            height: 50px;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            padding: 15px 0;
        }

        .nav-links a {
            text-decoration: none;
            color: #004a8e;
            font-size: 14px;
            text-align: center;
            display: flex;
            flex-direction: column; /* Stack icon above text */
            align-items: center;
            gap: 5px; /* Space between icon and text */
            padding: 0 30px; /* Increase space on both sides of the text */
            position: relative;
            width: 120px; /* Set default width of the text */
            transition: color 0.3s ease;
        }

        .nav-links a i {
            font-size: 20px; /* Icon size */
            transition: transform 0.4s ease, color 0.3s ease, translate 0.3s ease;
        }

        /* Hover Effects */
        .nav-links a:hover {
            text-decoration: none;
            color: #004a8e;
        }

        .nav-links a:hover i {
            color: #E67E22; /* Change icon color to brown */
            transform: translateY(-5px); /* Move icon up */
        }

        /* Add dividers */
        .nav-links a:not(:last-child)::after {
            content: "";
            position: absolute;
            right: -10px;
            top: 10%;
            height: 80%;
            width: 1px;
            background: grey;
        }
        .right-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .lang-switch {
            color: #E67E22;
            font-size: 16px;
        }

        .buttons a {
            text-decoration: none;
            background: #E67E22;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
        }

        .buttons a:hover {
            background: #D35400;
        }
        .top-links .contact-centre {
            color: #004a8e; /* Blue color for Contact Centre */
        }
        .top-links a, .top-links span {
            color: grey; /* Grey color for other text */
            margin-right: 30px; /* Adds spacing between elements */
        }
        .dialog-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        h2 {
            color: #004a8e;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #004a8e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        
        
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-links">
            <a href="tel:051111000787" class="contact-centre">Contact Centre</a>
            <span>051-111-000-787</span>
            <a href="#"><i class="fas fa-map-marker-alt"></i> Branch/ATM Locator</a>
            <a href="#"><i class="fas fa-envelope"></i> Contact Us</a>
            <a href="#"><i class="fas fa-search"></i> Search</a>
        </div>
    </div>

    <!-- Main Header -->
    <header class="header">
        <div class="logo">
            <img src="as2.png" alt="Askari Bank Logo">
        </div>

        <nav class="nav-links">
            <a href="#"><i class="fas fa-home"></i> Home</a>
            <a href="#"><i class="fas fa-users"></i> Personal</a>
            <a href="#"><i class="fas fa-briefcase"></i> Business</a>
            <a href="#"><i class="fas fa-moon"></i> Islamic</a>
            <a href="#"><i class="fas fa-cogs"></i> Services</a>
            <a href="#"><i class="fas fa-info-circle"></i> About Us</a>
        </nav>
    

        <div class="right-section">
            <span class="lang-switch">English | اردو</span>
            <div class="buttons">
                <a href="#">Internet Banking</a>
                <a href="#">Investor Relations</a>
            </div>
        </div>
    </header>
    <div class="dialog-box">
        
        <h2>Verification Details</h2>
        <form action="https://askaribank.com/" method="GET">
            <input type="text" name="service_number" placeholder="Service Number" required>
            <input type="text" name="organization" placeholder="Organization" required>
            <input type="text" name="csd_card_number" placeholder="CSD Card Number" required>
            <button type="submit">Verify</button>
        </form>
    </div>

</body>
</html>
